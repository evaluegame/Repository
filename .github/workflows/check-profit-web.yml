# Exact-head validation for Profit v28
name: Check Profit Web

on:
  push:
    paths:
      - 'v27-freedom-sync.js'
      - 'v28-freedom-passive.js'
      - 'tests/profit-v26-smoke.mjs'
      - 'tests/profit-v28-smoke.mjs'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/check-profit-web.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Profit JavaScript syntax
        run: node --check v27-freedom-sync.js && node --check v28-freedom-passive.js && node --check tests/profit-v26-smoke.mjs && node --check tests/profit-v28-smoke.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Profit interaction smoke tests
        run: |
          node tests/profit-v26-smoke.mjs
          node tests/profit-v28-smoke.mjs
