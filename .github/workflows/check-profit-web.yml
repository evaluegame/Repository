name: Check Profit Web

on:
  push:
    paths:
      - 'v25-final.js'
      - 'tests/profit-v25-smoke.mjs'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/check-profit-web.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Profit JavaScript syntax
        run: node --check v25-final.js && node --check tests/profit-v25-smoke.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Profit interaction smoke tests
        run: node tests/profit-v25-smoke.mjs
