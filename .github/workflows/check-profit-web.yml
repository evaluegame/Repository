name: Check Profit Web

on:
  push:
    paths:
      - 'v23-freedom-sync.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/check-profit-web.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Profit JavaScript syntax
        run: node --check v23-freedom-sync.js
