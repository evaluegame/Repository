name: Build Profit Android APK

on:
  push:
    paths:
      - 'profit-mobile/android/**'
      - '.github/workflows/build-profit-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: profit-mobile/android
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp profit-mobile/android/app/build/outputs/apk/debug/app-debug.apk Profit-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Profit-Android-APK
          path: Profit-Android.apk
