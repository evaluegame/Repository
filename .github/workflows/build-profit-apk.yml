name: Build Profit Android APK

on:
  push:
    paths:
      - 'profit-mobile/android/**'
      - '.github/workflows/build-profit-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: profit-mobile/android
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp profit-mobile/android/app/build/outputs/apk/debug/app-debug.apk Profit-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Profit-Android-APK
          path: Profit-Android.apk
      - name: Publish exact APK to Freedom Fighter website
        run: |
          mkdir -p freedom-fighter-site/downloads
          cp Profit-Android.apk freedom-fighter-site/downloads/Profit-Android.apk
          echo "Built APK bytes: $(wc -c < Profit-Android.apk)"
          echo "Published APK bytes: $(wc -c < freedom-fighter-site/downloads/Profit-Android.apk)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freedom-fighter-site/downloads/Profit-Android.apk
          if git diff --cached --quiet; then
            echo "Website APK already matches the compiled APK."
          else
            git commit -m "Publish exact Profit Android APK [skip ci]"
            git push origin HEAD:main
          fi
