name: Verify Profit Android launch

on:
  push:
    branches: ['fix/profit-launch-crash']
    paths: ['profit-mobile/android/**', '.github/workflows/build-profit-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROFIT_KEYSTORE: /home/runner/.android/profit-stable.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/profit-stable.keystore
          key: profit-android-stable-signing-v2
          fail-on-cache-miss: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build candidate
        working-directory: profit-mobile/android
        run: gradle assembleDebug
      - name: Launch on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r profit-mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.ainrox.profit.app/com.ainrox.profit.MainActivity
            sleep 15
            adb logcat -d > profit-launch-logcat.txt
            adb shell pidof com.ainrox.profit.app
      - name: Upload diagnostics and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Profit-launch-diagnostics
          path: |
            profit-launch-logcat.txt
            profit-mobile/android/app/build/outputs/apk/debug/app-debug.apk
