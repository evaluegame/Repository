plugins { id 'com.android.application' }

android {
    namespace 'com.ainrox.profit'
    compileSdk 35

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    defaultConfig {
        applicationId 'com.ainrox.profit'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
