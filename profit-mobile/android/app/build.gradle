plugins { id 'com.android.application' }

android {
    namespace 'com.ainrox.profit'
    compileSdk 35

    signingConfigs {
        debug {
            def ks = System.getenv('PROFIT_KEYSTORE')
            if (ks) storeFile file(ks)
            storePassword 'android'
            keyAlias 'profit'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    defaultConfig {
        applicationId 'com.ainrox.profit.app'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '1.6.3'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}