<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080a"><title>Freedom Fighter — Know When Work Becomes Optional</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080a}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07080a}.profit-download{position:fixed;right:16px;top:84px;z-index:999999;background:#d9ff63;color:#090b0e;text-decoration:none;font:900 13px/1 Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding:13px 16px;border-radius:999px;box-shadow:0 10px 34px #0008;border:1px solid #ffffff20}.profit-download:hover{transform:translateY(-1px)}@media(max-width:640px){.profit-download{top:auto;right:12px;left:12px;bottom:66px;text-align:center;font-size:14px}}</style></head><body><iframe id="marketingFrame" src="marketing.html" title="Freedom Fighter marketing website"></iframe><a class="profit-download" href="download-profit.html">↓ Profit App Downloads</a><script>const frame=document.getElementById('marketingFrame');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d||d.getElementById('exitNumber'))return;const $=id=>d.getElementById(id),grid=d.querySelector('#calculator .grid2'),result=d.querySelector('#calculator .result'),metrics=d.querySelector('#calculator .resultMetrics');if(!grid||!result||!metrics)return;const field=d.createElement('div');field.className='field';field.innerHTML='<label>Freedom / Exit Number ($)</label><input id="exitNumber" type="number" min="0" step="1000" value="1000000">';grid.insertBefore(field,grid.firstChild);const spendLabel=$('spend')?.previousElementSibling;if(spendLabel)spendLabel.textContent='Monthly spending ($) — fallback';const wrLabel=$('wr')?.previousElementSibling;if(wrLabel)wrLabel.textContent='Withdrawal rate (%) — fallback';const lead=d.querySelector('#calculator .sectionLead');if(lead)lead.textContent='Set the exact invested amount that means freedom to you — for example $1,000,000 — then see your progress, projected Freedom Date, and how a purchase changes it.';const targetSmall=$('target')?.previousElementSibling;if(targetSmall)targetSmall.textContent='Exit / Freedom Number';const progressCard=d.createElement('div');progressCard.className='rm';progressCard.innerHTML='<small>Freedom progress</small><strong id="freedomProgress">—</strong>';metrics.appendChild(progressCard);const remainingCard=d.createElement('div');remainingCard.className='rm';remainingCard.innerHTML='<small>Money remaining</small><strong id="freedomRemaining">—</strong>';metrics.appendChild(remainingCard);const bar=d.createElement('div');bar.style.cssText='margin:14px 0 4px;background:#0a0b0d24;border-radius:999px;height:13px;overflow:hidden';bar.innerHTML='<div id="freedomProgressBar" style="height:100%;width:0;background:#0a0b0d;border-radius:999px;transition:width .25s ease"></div>';const txt=$('resultText');txt?.insertAdjacentElement('afterend',bar);const caption=d.createElement('div');caption.id='freedomProgressCaption';caption.style.cssText='font-size:12px;font-weight:900;margin:6px 0 14px';bar.insertAdjacentElement('afterend',caption);const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v||0);function mt(start,monthly,target,annualPct){let v=Math.max(0,start),r=Math.pow(1+annualPct/100,1/12)-1;if(v>=target)return 0;for(let m=1;m<=1800;m++){v=v*(1+r)+monthly;if(v>=target)return m}return Infinity}function dateFor(months){if(!Number.isFinite(months))return'100+ years';const x=new Date();x.setMonth(x.getMonth()+months);return x.toLocaleDateString('en-US',{month:'short',year:'numeric'})}function delayLabel(days){if(!Number.isFinite(days))return'Not reachable';if(days<14)return`+${Math.max(0,Math.round(days))} days`;if(days<60)return`+${Math.round(days/7)} weeks`;if(days<730)return`+${Math.round(days/30.4375)} months`;return`+${(days/365.25).toFixed(1)} years`}function updateExit(){const a=+$('assets').value||0,c=+$('contrib').value||0,s=+$('spend').value||0,r=+$('ret').value||0,w=Math.max(.1,+$('wr').value||4),p=Math.max(0,+$('purchase').value||0),custom=Math.max(0,+$('exitNumber').value||0),target=custom>0?custom:s*12/(w/100),base=mt(a,c,target,r),after=mt(Math.max(0,a-p),c,target,r),delayMonths=Number.isFinite(base)&&Number.isFinite(after)?Math.max(0,after-base):Infinity,days=Number.isFinite(delayMonths)?delayMonths*30.4375:Infinity,progress=target>0?Math.min(100,Math.max(0,a/target*100)):0,remaining=Math.max(0,target-a),mr=Math.pow(1+r/100,1/12)-1,future=Number.isFinite(base)?p*Math.pow(1+mr,base):0;$('delay').textContent=delayLabel(days);$('baseDate').textContent=dateFor(base);$('afterDate').textContent=dateFor(after);$('target').textContent=money(target);$('future').textContent=money(future);$('freedomProgress').textContent=progress.toFixed(progress>=10?1:2)+'%';$('freedomRemaining').textContent=money(remaining);$('freedomProgressBar').style.width=progress+'%';$('freedomProgressCaption').textContent=`${money(a)} invested of ${money(target)} exit number`;$('resultText').textContent=!Number.isFinite(base)?'At these assumptions, the model does not reach your Exit Number within 150 years.':remaining<=0?`You have reached your ${money(target)} Exit Number. A ${money(p)} purchase is modeled to change the timeline by about ${Math.round(days)} days.`:`You are ${progress.toFixed(1)}% of the way to your ${money(target)} Exit Number. Buying ${money(p)} today is modeled to delay it by about ${Math.round(days)} days.`}['assets','contrib','spend','ret','wr','purchase','exitNumber'].forEach(id=>$(id)?.addEventListener('input',()=>setTimeout(updateExit,0)));setTimeout(updateExit,0)}catch(e){console.error('Freedom Number enhancement failed',e)}});</script><script src="experience.js?v=1"></script></body></html>
