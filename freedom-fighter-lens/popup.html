<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#090b0f;--p:#141820;--t:#f8fafc;--m:#9ca3af;--a:#d9ff63}*{box-sizing:border-box}body{margin:0;width:350px;background:var(--bg);color:var(--t);font:14px Inter,system-ui,sans-serif}.w{padding:18px}.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:950}.mark{width:30px;height:30px;border-radius:9px;background:var(--a);color:#090b0f;display:grid;place-items:center;font-weight:1000}.lead{color:var(--m);line-height:1.45;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.f{background:var(--p);border:1px solid #ffffff0d;border-radius:12px;padding:10px}.f.wide{grid-column:1/-1;border-color:#d9ff6333;background:#182016}.f label{display:block;font-size:9px;font-weight:900;color:var(--m);text-transform:uppercase;margin-bottom:5px}.f.wide label{color:#dfff82}.f input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-weight:900;font-size:17px}.f.wide input{font-size:22px;color:var(--a)}.save{width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;background:var(--a);color:#090b0f;font-weight:1000}.status{margin-top:10px;color:#a8f07a;font-size:11px;min-height:16px}.switch{display:flex;justify-content:space-between;align-items:center;background:var(--p);border-radius:12px;padding:11px;margin-top:10px}.switch input{accent-color:#d9ff63}.fine{font-size:9px;line-height:1.4;color:#68707d;margin-top:10px}</style></head><body><div class="w"><div class="brand"><span class="mark">F</span>Freedom Fighter Lens</div><p class="lead">Set the exact invested amount that means freedom to you. The Lens estimates how purchases can move that date.</p><div class="grid"><div class="f wide"><label>Freedom / Exit Number ($)</label><input id="exitNumber" type="number" min="0" step="1000"></div><div class="f"><label>Invested assets ($)</label><input id="assets" type="number" min="0"></div><div class="f"><label>Monthly investing ($)</label><input id="contribution" type="number" min="0"></div><div class="f"><label>Monthly spending — fallback</label><input id="spending" type="number" min="1"></div><div class="f"><label>Expected return (%)</label><input id="returnRate" type="number" step="0.1"></div><div class="f"><label>Withdrawal rate — fallback</label><input id="withdrawalRate" type="number" min="1" max="10" step="0.1"></div><div class="f"><label>Manual price override</label><input id="manualPrice" type="number" min="0" placeholder="Auto"></div></div><div class="switch"><span>Show Lens on shopping pages</span><input id="enabled" type="checkbox" checked></div><button class="save" id="save">Save & refresh Lens</button><div class="status" id="status"></div><p class="fine">If Exit Number is blank or 0, the Lens falls back to annual spending ÷ withdrawal rate. Educational estimate only.</p></div><script src="popup.js"></script></body></html>
